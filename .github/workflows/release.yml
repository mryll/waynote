name: Release

# A tag push builds the binary and publishes the GitHub release the AUR
# waynote-bin package downloads. The manual trigger only builds, to check
# the runner before cutting a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # ubuntu-24.04 pins glibc 2.39, the floor the published binaries have
    # required since 0.1.5; `ubuntu-latest` would raise it silently.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config meson ninja-build \
            libwayland-dev wayland-protocols

      # Ubuntu 24.04 ships no libgtk4-layer-shell-dev; build the library from
      # source, pinned to the v1.3.0 tag by commit so the input cannot move.
      - name: Build gtk4-layer-shell
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          git checkout 1c963c51514581c41b9bdae08cdf69171265cdda
          meson setup build -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Prepare binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/release/waynote "waynote-${VERSION}-x86_64-linux"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          objdump -T "waynote-${VERSION}-x86_64-linux" | grep -o 'GLIBC_[0-9.]*' | sort -V | uniq | tail -1

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "waynote-${VERSION}-x86_64-linux"
          --title "$GITHUB_REF_NAME"
          --generate-notes
